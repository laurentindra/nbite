<div class="container" data-if="loading">
  <div class="panel">Loading conversation… <a class="linkb" href="#partner-chats">Back to inbox</a></div>
</div>
<div class="container chat-page" data-if="ready">
  <a class="crumb" href="#partner-chats"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#left"/></svg>Back to inbox</a>
  <div class="chat-heading">
    <div class="chat-store-icon"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#user"/></svg></div>
    <div><h1 data-field="customer"></h1><p class="muted" data-field="meta"></p></div>
  </div>
  <div data-slot="thread"></div>
  <form class="chat-compose" data-form="partner-message">
    <textarea name="message" rows="2" maxlength="1000" placeholder="Reply to this customer…" required></textarea>
    <button class="btn btn-p" type="submit">Send reply <svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#message"/></svg></button>
  </form>
</div>
