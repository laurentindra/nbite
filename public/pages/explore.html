<div class="container">
  <div class="pagehead">
    <div class="eyebrow">Margonda, Depok</div>
    <h1>Explore deals</h1>
    <p class="muted">Browse packages from local stores and check each one’s pickup window.</p>
  </div>
  <div class="xtop">
    <label class="bigsearch"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#search"/></svg><input id="xq" placeholder="Find your next bite..." aria-label="Search deals" autocomplete="off"></label>
    <div class="seg" role="group" aria-label="View">
      <button data-a="view" data-v="list" aria-pressed="false"><svg class="ic s16" aria-hidden="true"><use href="assets/img/icons.svg#list"/></svg>List</button>
      <button data-a="view" data-v="map" aria-pressed="false"><svg class="ic s16" aria-hidden="true"><use href="assets/img/icons.svg#map"/></svg>Map</button>
    </div>
    <button class="btn btn-s fbtn" data-a="drawer"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#sliders"/></svg><span data-field="filtersLabel">Filters</span></button>
  </div>
  <div class="chips xcats" role="group" aria-label="Categories">
    <button class="chip" aria-pressed="false" data-a="cat" data-c="All">All</button>
    <button class="chip" aria-pressed="false" data-a="cat" data-c="Bakery">Bakery</button>
    <button class="chip" aria-pressed="false" data-a="cat" data-c="Meals">Meals</button>
    <button class="chip" aria-pressed="false" data-a="cat" data-c="Snacks">Snacks</button>
    <button class="chip" aria-pressed="false" data-a="cat" data-c="Café">Café</button>
  </div>
  <div class="xlayout">
    <aside class="fpanel desk" aria-label="Filters" data-list="filters"></aside>
    <section id="xres" aria-label="Results"></section>
  </div>
</div>
