<div class="container">
  <div class="pagehead"><h1>Profile</h1></div>
  <div class="pgrid">
    <div class="panel profile-card">
      <div class="profile-avatar" data-field="initial"></div>
      <div class="profile-name" data-field="name"></div>
      <div class="muted" data-field="email"></div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="price" data-field="rescued"></div><div class="muted profile-stat-label">bites rescued</div></div>
        <div class="profile-stat"><div class="price profile-stat-money" data-field="saved"></div><div class="muted profile-stat-label">saved</div></div>
      </div>
    </div>
    <div>
      <div class="panel menu menu-flush">
        <button class="mi" data-a="modal" data-k="locs"><span class="mi-icon"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#pin"/></svg></span><span class="mi-label">Saved locations</span><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#right"/></svg></button>
        <button class="mi" data-a="modal" data-k="favs"><span class="mi-icon"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#heart"/></svg></span><span class="mi-label">Favorite merchants</span><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#right"/></svg></button>
        <button class="mi" data-a="nav" data-to="orders"><span class="mi-icon"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#bag"/></svg></span><span class="mi-label">Order history</span><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#right"/></svg></button>
        <button class="mi" data-a="nav" data-to="messages"><span class="mi-icon"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#info"/></svg></span><span class="mi-label">Messages with stores</span><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#right"/></svg></button>
        <button class="mi" data-a="notif"><span class="mi-icon"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#bell"/></svg></span><span class="mi-label">Notification settings</span><span class="sw-tog" role="switch" aria-checked="false" aria-label="Notifications"></span></button>
        <button class="mi" data-a="toast" data-m="Help and support is coming soon"><span class="mi-icon"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#info"/></svg></span><span class="mi-label">Help &amp; support</span><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#right"/></svg></button>
        <button class="mi" data-a="toast" data-m="The privacy policy page is coming soon"><span class="mi-icon"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#shield"/></svg></span><span class="mi-label">Privacy policy</span><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#right"/></svg></button>
        <button class="mi mi-logout" data-a="logout"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#out"/></svg><span class="mi-label">Log out</span></button>
      </div>
      <p class="hint">Night Bite demo · not a production system</p>
    </div>
  </div>
</div>
