<div class="ocard">
  <div class="ocard-main">
    <div class="ocard-thumb"><div class="art-box" data-art role="img" aria-label="Illustration placeholder for food photo"><img alt=""></div></div>
    <div class="ocard-info">
      <div class="ocard-top"><div class="muted ocard-merchant" data-field="merchant"></div><span data-slot="status"></span></div>
      <div class="ocard-title" data-field="title"></div>
      <div class="ocard-total" data-field="total"></div>
    </div>
  </div>
  <div class="ocard-foot">
    <span class="pk"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#clock"/></svg><span data-field="when"></span></span>
    <a class="btn btn-s sm" data-field="cta"></a>
  </div>
</div>
